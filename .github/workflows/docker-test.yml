name: Docker Build and Test

on:
  push:
    branches:
      - '*'
  pull_request:
    branches:
      - '*'

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
        lfs: true

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Set up DVC
      uses: iterative/setup-dvc@v1

    - name: Configure AWS credentials for DVC
      env:
        AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
        AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      run: |
        dvc remote modify --local myremote access_key_id $AWS_ACCESS_KEY_ID
        dvc remote modify --local myremote secret_access_key $AWS_SECRET_ACCESS_KEY

    - name: Pull data with DVC
      run: |
        dvc pull

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Cache Docker layers
      uses: actions/cache@v3
      with:
        path: /tmp/.buildx-cache
        key: ${{ runner.os }}-buildx-${{ github.sha }}
        restore-keys: |
          ${{ runner.os }}-buildx-

    - name: Build offline inference Docker image
      run: |
        docker build \
          --build-arg BUILDKIT_INLINE_CACHE=1 \
          --cache-from type=local,src=/tmp/.buildx-cache \
          --cache-to type=local,dest=/tmp/.buildx-cache-new \
          -t ml-app:ci-test .

    - name: Test offline inference Docker container
      run: |
        # Create test input data
        mkdir -p docker_data
        cat > docker_data/input.csv << EOF
        text
        "The former president of a Vatican-owned hospital in Rome on Saturday was convicted of abuse of office for diverting nearly half a million dollars of funds to renovate a top cardinal s luxury apartment. The Vatican court, a three-judge panel, gave Giuseppe Profiti a one-year suspended sentence. The prosecution had asked for three years for the former head of the prestigious Bambino Gesu hospital. It also reduced the seriousness of the charge against Profiti to abuse of office from the initial embezzlement. Massimo Spina, the hospital s treasurer, was acquitted. Testimony at the trial, which began in July in the city-state s courtroom, again exposed lack of transparency in the financial handling of Vatican assets in Italy, where it owns numerous institutions and much real estate. Profiti and Spina were charged with spending 422,000 euros ($481,000) in 2013 and 2014 on refurbishing the large Vatican retirement home of Cardinal Tarcisio Bertone, the Holy See s former number two. His retirement apartment, which has a huge terrace and breath-taking view of the dome of St. Peter s Basilica, has become a symbol of the difficulty of the frugal-minded pope s efforts to rein in the luxury some Church leaders still enjoy. Bertone, 82, was the Vatican secretary of state, effectively the deputy pope, for most of the pontificate of former Pope Benedict and was one of the most powerful men in the Roman Catholic Church. He was removed from office in 2013, eight months after the election of Francis. The renovation started a few weeks later on the spacious property, which is next door to the Vatican guest house where the pope lives in a modest suite. Bertone hired the construction firm of a friend to do the reconstruction work, bypassing the customary bidding process, and made a down payment with his own money. The company eventually went bankrupt but the foundation that runs the hospital sent 422,000 euros to a London-based company affiliated with the construction firm. Neither Bertone nor the owner of the construction company were called to testify at the trial. When the Vatican confirmed last year that Profiti and Spina were under investigation, a lawyer for Bertone said the cardinal had never asked for or authorized payment for the restoration work from hospital funds. Profiti said the hospital used some of its funds to renovate Bertone s apartment because the cardinal had agreed that it could be used for fundraising. After the scandal was first revealed in a book, Bertone gave 150,000 euros of his own money to the Bambino Gesu to make amends for damage done to the hospital s image."
        "U.S. Senate Majority Leader Mitch McConnell on Wednesday said he was weighing options to help deal with Puerto Rico’s fiscal crisis but that any move by Congress to help the territorial island cannot cost U.S. taxpayers any money. McConnell, whose comments follow a letter sent earlier by Senate Democrats and independents, did not commit to any legislative action."
        "Japan s Oxford-educated crown prince, Naruhito, looks set to  bring a more global outlook to the ancient imperial institution while carrying on Emperor Akihito s legacy of promoting peace and reconciliation with Asia when he ascends the throne in 2019. Prime Minister Shinzo Abe s cabinet on Friday signed off on  an April 30, 2019 date for the octogenarian Akihito s retirement - the first abdication by a Japanese monarch in two centuries. Akihito, who turns 84 on Dec. 23, has spent much of his nearly three decades on the throne trying to heal the wounds of a war fought in his father Hirohito s name and highlighting the needs of the vulnerable in society. He said in August 2016 that he feared age would make it hard to fulfil his duties.  As an Oxford-educated scholar and well traveled crown prince, Naruhito can draw on a wealth of international experience in carrying out the duties his father pioneered,  said Jeffrey Kingston, director of Asian studies at Temple University Japan. Naruhito, 57, is an advocate for environmental causes, and has taken part in international conferences on clean water.  Certainly, on environmental issues, he s very passionate,   said Shihoko Goto, a senior associate for Northeast Asia at the Washington-based Wilson Center.   He is also very concerned about women s rights ... the idea of empowering women and giving them a position of dignity that goes beyond their place in the traditional world.  Naruhito defied palace officials to marry Masako Owada, a Harvard- and Oxford-educated diplomat who has suffered from stress-related illness brought on by the demands of palace life and pressure to bear a royal heir. At one point, he shocked the public with his blunt defense of his wife from criticism and pressure, drawing a rebuke from his younger brother and sorrowful remarks from his father. Masako s daughter, 16-year-old Aiko, cannot inherit the males-only throne. A one-off law allowing Akihito to abdicate was enacted in June, but did not address the controversial issue of female succession - a matter that is becoming increasingly pressing as the royal family shrinks and ages. Akihito has only one grandson, 11-year-old Prince Hisahito. How Masako, 53, copes with the role of empress will be closely watched.  My hope is that ... she will be able to express herself and embrace some of the things she wants to do and be at the forefront of imperial diplomacy,  the Wilson Center s Goto said."
        EOF
        
        # Run container with test data
        docker run \
          -v $(pwd)/docker_data:/docker_data \
          ml-app:ci-test \
          --input_path /docker_data/input.csv \
          --output_path /docker_data/output.csv
        
        # Verify output file exists and has correct structure
        echo "Checking output file:"
        head -3 docker_data/output.csv
        echo ""
        echo "Number of predictions:"
        wc -l docker_data/output.csv
        
        # Check that output contains 3 lines
        response=$(wc -l docker_data/output.csv)
        if [[ "$response" != "3 docker_data/output.csv" ]]; then
          echo "ERROR: Output file doesn't have expected number of predictions"
          exit 1
        fi
        
        # Check that output contains required columns
        if ! head -1 docker_data/output.csv | grep -q "text,prediction,score"; then
          echo "ERROR: Output file doesn't have expected columns"
          exit 1
        fi

    - name: Build online inference Docker image (TorchServe)
      run: |
        docker build \
          --build-arg BUILDKIT_INLINE_CACHE=1 \
          -t mymodel-serve:ci-test \
          -f torchserve/torchserve.Dockerfile .

    - name: Test online inference Docker container
      run: |
        # Start container in background
        docker run -d \
          --name torchserve-test \
          -p 8080:8080 \
          -p 8081:8081 \
          mymodel-serve:ci-test
        
        # Wait for container to start
        sleep 45
        
        # Test health endpoint
        echo "Testing health endpoint:"
        curl -f http://localhost:8080/ping
        
        # Test prediction endpoint
        echo -e "\nTesting prediction endpoint:"
        
        # Create test text files
        mkdir -p torchserve_test_examples
        echo "kupil muzhik shlyapu a ona emu kak raz" > torchserve_test_examples/test1.txt
        echo "BREAKING: MEDVED uvidel GORYASHUYU MASHINU, sel v nee y SGOREL" > torchserve_test_examples/test2.txt
        
        # Send prediction requests
        echo "First example:"
        curl -X POST http://localhost:8080/predictions/distilbert -T torchserve_test_examples/test1.txt
        echo -e "Second example:"
        curl -X POST http://localhost:8080/predictions/distilbert -T torchserve_test_examples/test2.txt
        
        # Check model metrics
        echo -e "\n\nModel metrics:"
        curl http://localhost:8081/models
        
        # Cleanup
        docker stop torchserve-test
        docker rm torchserve-test

    - name: Clean up
      if: always()
      run: |
        docker system prune -f
        rm -rf docker_data torchserve_test_examples test_data ci_model ci_training_params.yaml ci_metrics.json